{% extends "base.html" %}
{% block content %}
<section class="panel">
    <h2>Admin audit logs</h2>
    <p class="muted">Latest 500 events.</p>
    <div class="table-wrap">
    <table>
        <tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr>
        {% for r in rows %}
        <tr>
            <td>{{ r.event_time }}</td>
            <td>{{ r.actor_username or "system" }}</td>
            <td>{{ r.action }}</td>
            <td>{{ r.target_username or "-" }}</td>
            <td>{{ r.details or "-" }}</td>
        </tr>
        {% endfor %}
    </table>
    </div>
</section>
{% endblock %}
