<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>License Error — POS V3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .license-error-box {
            max-width: 600px;
            margin: 80px auto;
            background: #fff8f8;
            border: 2px solid #e53e3e;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
        }
        .license-error-box h1 { color: #c53030; margin-bottom: 12px; }
        .license-error-box p  { color: #555; margin-bottom: 20px; }
        .license-error-box .error-detail {
            background: #fff3f3;
            border: 1px solid #feb2b2;
            border-radius: 4px;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 0.9em;
            color: #c53030;
            text-align: left;
            margin-bottom: 24px;
        }
        .license-error-box a {
            display: inline-block;
            padding: 10px 24px;
            background: #3182ce;
            color: #fff;
            border-radius: 4px;
            text-decoration: none;
        }
        .license-error-box a:hover { background: #2b6cb0; }
    </style>
</head>
<body>
<main>
<div class="license-error-box">
    <h1>&#128274; License Error</h1>
    <p>This application cannot start because the software license is invalid or missing.</p>
    {% if error %}
    <div class="error-detail">{{ error }}</div>
    {% endif %}
    <p>Please contact your software vendor to obtain or renew your license,<br>
       then place the <strong>license.key</strong> file in the application directory and restart.</p>
    <a href="/">Try again</a>
</div>
</main>
</body>
</html>
