{% extends "base.html" %}
{% block content %}
<section class="login-welcome">
    <div class="login-welcome-copy">
        <span class="login-kicker">JOSEA OUTSOURCING LTD</span>
        <h2>Bienvenue dans POS V3</h2>
        <p>Gérez les ventes, le stock, les achats et les recettes quotidiennes depuis un espace de travail sécurisé.</p>
    </div>
    <section class="panel login-panel">
        <h2>Connectez-vous pour continuer</h2>
    <form method="post" class="form-grid login-grid">
        <input name="username" placeholder="Nom d'utilisateur" required>
        <input name="password" type="password" placeholder="Mot de passe" required>
        <label class="terms-check-label">
            <input type="checkbox" name="terms_accepted" value="1" required>
            J'ai lu et j'accepte les
            <a href="/terms" target="_blank">Conditions d'utilisation</a>
            et
            <a href="/privacy" target="_blank">Politique de confidentialité</a>.
        </label>
        <button type="submit">Connexion</button>
    </form>
    </section>
</section>
{% endblock %}
